[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agnes2api"
version = "1.4.1"
description = "把 Agnes AI 的图片接口包成本地 OpenAI 兼容网关（多账号池 + 管理台 + MCP 工具）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "yzz103" }]
keywords = ["agnes-ai", "openai-compatible", "image-generation", "gateway", "mcp", "proxy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/yzz103/yzz-dsh/tree/main/agnes2api"

[project.scripts]
agnes2api = "agnes2api:main"
gen-image = "gen_image:main"
mcp-agnes = "mcp_agnes:main"
agnes-mcp-install = "install_mcp_config:main"

[tool.setuptools]
# 全部是独立脚本，没有包结构；装的时候按模块铺开即可
py-modules = ["agnes2api", "gen_image", "mcp_agnes", "install_mcp_config"]

[tool.ruff]
line-length = 100
target-version = "py39"
